name: Verify page outputs

# Checks that every printed output shown on the page still matches real NumPy and TensorFlow,
# and that all Python scripts run. Hosting is separate: GitHub Pages serves the main branch root.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm test

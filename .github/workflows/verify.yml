name: Verify page outputs

# For every walkthrough: checks that each printed output shown on the page still matches real
# NumPy (and TensorFlow, where used), and that all Python scripts run. Hosting is separate:
# GitHub Pages serves the main branch root.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each project folder has its own package.json, requirements.txt and `npm test`.
        project:
          - ml-ai/tiny-cnn-walkthrough
          - ml-ai/tiny-llm-walkthrough
          - ml-ai/log-autoencoder-walkthrough
          - ml-ai/image-recognition-walkthrough
    name: verify (${{ matrix.project }})
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: npm ci
      # Projects whose smoke test runs in a real browser (Playwright) need Chromium
      - if: hashFiles(format('{0}/node_modules/playwright/package.json', matrix.project)) != ''
        run: npx playwright install --with-deps chromium
      - run: pip install -r requirements.txt
      - run: npm test

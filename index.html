<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f5f7f8;--panel:#fff;--fg:#1b2428;--muted:#5d6b72;--faint:#6b7a80;--line:#dbe2e5;--accent:#1f6f8b;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#11181b;--panel:#182226;--fg:#e4ecee;--muted:#9aaab0;--faint:#9aaab0;--line:#2a373c;--accent:#6cbfdc;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0;max-width:65ch;color:var(--muted)}
nav.crumbs{font-size:14px;color:var(--faint)}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
ul.cards{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ul.cards a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;text-decoration:none;color:inherit}
ul.cards a:hover{border-color:var(--accent)}
ul.cards h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 4px;color:var(--accent)}
ul.cards p{font-size:15px}
</style>
</head>
<body>
<main class="wrap">
  <h1>Learning tools</h1>
  <p>Small interactive pages for understanding how things work, where every number can be seen and checked.</p>
  <ul class="cards">
    <li><a href="ml-ai/"><h2>Machine learning and AI</h2><p>Interactive walkthroughs of neural networks and how they learn.</p></a></li>
  </ul>
</main>
</body>
</html>
